[project]
name = "hawkeye"
version = "0.1.0"
description = "Hawkeye — adversarial-verification investment decision system (catalyst-driven US equities MVP)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]
# yfinance and lxml were dropped on 2026-08-09. They existed for two Yahoo
# surfaces, and both are gone: the reported-EPS reader in 2026-08-08 and the
# consensus source here. Yahoo is still read for prices, market cap, turnover
# and news (`hawkeye/marketdata/yahoo.py`), but that talks to the quote
# endpoint over httpx and never needed either library.

[project.optional-dependencies]
llm = ["anthropic>=0.40"]
dev = ["pytest>=8", "anthropic>=0.40"]

[project.scripts]
hawkeye = "hawkeye.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hawkeye"]

[tool.pytest.ini_options]
testpaths = ["tests"]
