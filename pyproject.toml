[project]
name = "hawkeye"
version = "0.1.0"
description = "Hawkeye — adversarial-verification investment decision system (catalyst-driven US equities MVP)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    # Reported EPS and its consensus (hawkeye/marketdata/yahoo_earnings.py).
    # lxml is not optional in practice: without it get_earnings_dates()
    # raises ImportError, and that is the single surface this depends on.
    "yfinance>=1.5",
    "lxml>=5.0",
]

[project.optional-dependencies]
llm = ["anthropic>=0.40"]
dev = ["pytest>=8", "anthropic>=0.40"]

[project.scripts]
hawkeye = "hawkeye.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hawkeye"]

[tool.pytest.ini_options]
testpaths = ["tests"]
